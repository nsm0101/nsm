# OpenHands PR review (self-serve, open source).
# Setup: add an LLM_API_KEY repository secret. Trigger: add the "review-this" label to a PR.
# Upstream: https://github.com/OpenHands/software-agent-sdk/tree/main/examples/03_github_workflows/02_pr_review
name: PR Review by OpenHands

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-review:
    if: github.event.label.name == 'review-this'
    runs-on: ubuntu-latest
    steps:
      - uses: OpenHands/extensions/plugins/pr-review@main
        with:
          llm-model: anthropic/claude-sonnet-5-5
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
